name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint:check
      - name: Format
        run: pnpm format:check
      - name: Build Web (Generate Routes)
        run: pnpm --filter @city/web build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (Non-Parity)
        run: pnpm test
      - name: Test (Parity + Heavy Replay)
        env:
          CITY_TEST_PARITY: 1
          CITY_TEST_PARITY_REPLAY_HEAVY: 1
        run: pnpm test-parity
      - name: Build
        run: pnpm build
